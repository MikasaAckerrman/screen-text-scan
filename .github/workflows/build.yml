name: build-apk

# Сборка в CI, а не локально: в песочнице нет Android SDK, а поставить его
# туда нельзя — нужен aapt2 под aarch64-musl, которого в поставке нет.
# Здесь же SDK уже готов, и получается подписанный APK, который можно
# скачать и поставить на телефон.

on:
  push:
    branches: [main, screentextscan]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      # Gradle ставим действием, а не wrapper'ом: gradle-wrapper.jar —
      # бинарник, и держать его в репозитории ради одной сборки незачем.
      - name: Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      # Проверка границы «инструмент записи → исходник». Однажды вместо
      # ZoneSelectorView.java в репозиторий попал служебный маркер offload,
      # а javac сообщил лишь общую ошибку на первой строке. Ловим это явно.
      - name: Целостность Java исходников
        run: python3 tests/check_sources.py

      # ---------------------------------------------------------------
      # Проверка чистой логики ДО сборки. Оба проверяемых класса намеренно
      # не зависят от Android: накопитель — вообще ни от чего, геометрия —
      # только от Rect, который подменяется настоящей реализацией из
      # tests/stub (в android.jar все методы бросают "Stub!").
      #
      # Если сломана дедупликация или ручки рамки, собирать APK не нужно.
      # ---------------------------------------------------------------
      - name: Тест накопителя текста
        run: |
          mkdir -p /tmp/t1
          cp app/src/main/java/com/screentextscan/TextAccumulator.java /tmp/t1/
          cp tests/TextAccumulatorTest.java /tmp/t1/
          cd /tmp/t1
          sed -i 's/^package com.screentextscan;//' TextAccumulator.java
          javac -d out TextAccumulator.java TextAccumulatorTest.java
          java -cp out TextAccumulatorTest

      - name: Тест геометрии зоны
        run: |
          mkdir -p /tmp/t2/android/graphics
          cp tests/stub/android/graphics/Rect.java /tmp/t2/android/graphics/
          cp app/src/main/java/com/screentextscan/ZoneGeometry.java /tmp/t2/
          cp tests/ZoneGeometryTest.java /tmp/t2/
          cd /tmp/t2
          sed -i 's/^package com.screentextscan;//' ZoneGeometry.java
          javac -d out android/graphics/Rect.java ZoneGeometry.java ZoneGeometryTest.java
          java -cp out ZoneGeometryTest

      - name: Тест логики перевода
        run: |
          mkdir -p /tmp/t3
          cp app/src/main/java/com/screentextscan/TextTranslatorLogic.java /tmp/t3/
          cp tests/TextTranslatorTest.java /tmp/t3/
          cd /tmp/t3
          sed -i 's/^package com.screentextscan;//' TextTranslatorLogic.java
          javac -d out TextTranslatorLogic.java TextTranslatorTest.java
          java -cp out TextTranslatorTest

      # Сверка ресурсов: каждая ссылка R.* и @string/... должна существовать.
      # Отдельным шагом, потому что aapt2 сообщает об этом невнятно, а
      # причина обычно — переименованный ресурс.
      - name: Сверка ресурсов
        run: python3 tests/check_resources.py

      # Граф зависимостей. Первая сборка с ML Kit упала на дубликатах
      # kotlin-stdlib, и это видно по POM-графу до сборки: скрипт обходит
      # его и сверяет с блоком constraints.
      - name: Сверка зависимостей
        run: python3 tests/check_deps.py

      - name: Сборка release
        run: gradle assembleRelease --no-daemon --stacktrace

      # ---------------------------------------------------------------
      # Сборка даёт несколько APK: по одному на архитектуру плюс
      # универсальный. Забираем все, но arm64 переименовываем понятно —
      # именно он нужен для любого современного телефона, а универсальный
      # весит втрое больше из-за копий libtranslate_jni.so.
      # ---------------------------------------------------------------
      - name: Собрать артефакты
        run: |
          SHA=$(git rev-parse --short HEAD)
          mkdir -p out
          for f in $(find app/build/outputs/apk/release -name '*.apk'); do
            case "$f" in
              *arm64-v8a*)   cp "$f" "out/ScreenTextScan-$SHA-arm64.apk" ;;
              *armeabi-v7a*) cp "$f" "out/ScreenTextScan-$SHA-arm32.apk" ;;
              *universal*)   cp "$f" "out/ScreenTextScan-$SHA-universal.apk" ;;
              *)             cp "$f" "out/ScreenTextScan-$SHA.apk" ;;
            esac
          done
          ls -l out/
          sha256sum out/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: out/*.apk
          if-no-files-found: error
