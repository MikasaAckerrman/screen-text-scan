plugins {
    id 'com.android.application'
}

def ciRunNumber = System.getenv('GITHUB_RUN_NUMBER')
def releaseStoreFile = System.getenv('STS_KEYSTORE_FILE')
def releaseStorePassword = System.getenv('STS_KEYSTORE_PASSWORD')
def releaseKeyAlias = System.getenv('STS_KEY_ALIAS')
def releaseKeyPassword = System.getenv('STS_KEY_PASSWORD')

def releaseRequested = gradle.startParameter.taskNames.any { taskName ->
    def name = taskName.tokenize(':').last().toLowerCase()
    name == 'assemblerelease' || name == 'bundlerelease'
}
if (releaseRequested && [releaseStoreFile, releaseStorePassword,
                         releaseKeyAlias, releaseKeyPassword].any {
    it == null || it.isEmpty()
}) {
    throw new GradleException('Release signing environment is incomplete')
}

android {
    namespace 'com.screentextscan'
    compileSdk 34

    defaultConfig {
        applicationId 'com.screentextscan'
        minSdk 26          // TileService (плитка быстрых настроек) появилась в API 24,
                           // но 26 даёт нормальные каналы уведомлений и foreground-сервис
        targetSdk 34
        // База защищает от downgrade даже если workflow когда-нибудь
        // пересоздадут и GITHUB_RUN_NUMBER снова начнётся с единицы.
        versionCode 10_000 + (ciRunNumber ? ciRunNumber.toInteger() : 0)
        versionName '1.2'
    }

    signingConfigs {
        release {
            if (releaseStoreFile) {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Один постоянный ключ хранится в GitHub Actions Secrets.
            // Новый debug-ключ на каждом CI-run делал APK несовместимыми.
            signingConfig signingConfigs.release
        }
    }

    /*
     * РАЗДЕЛЕНИЕ ПО АРХИТЕКТУРАМ — иначе APK весит 66 МБ.
     *
     * Замерено на первой сборке с переводом: libtranslate_jni.so занимает
     * 11–17 МБ на КАЖДУЮ из четырёх архитектур, то есть 62 МБ из 66 — это
     * копии одной библиотеки для процессоров, которых на конкретном
     * телефоне нет.
     *
     * x86 и x86_64 исключены целиком: это эмуляторы и редкие планшеты, для
     * которых собирать отдельный файл незачем. Остаются два ARM: arm64-v8a
     * (все современные устройства) и armeabi-v7a (старые, до 2015 года).
     *
     * universalApk true оставлен намеренно: сборка «на любое устройство»
     * нужна, когда неизвестно, куда ставить, — например когда файл
     * пересылают. Она большая, но выбор есть.
     */
    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a', 'armeabi-v7a'
            universalApk true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // androidx.core — для ContextCompat и совместимых уведомлений.
    implementation 'androidx.core:core:1.13.1'

    /*
     * Перевод НА УСТРОЙСТВЕ. Приложение читает чужие экраны — это личные
     * данные, и отправлять их на сторонний сервер ради перевода
     * недопустимо. ML Kit скачивает языковую пару один раз (~30 МБ) и дальше
     * работает без интернета.
     *
     * translate тянет за собой play-services-tasks и play-services-mlkit —
     * это ~1.5 МБ кода в APK, сами модели в APK НЕ входят.
     */
    implementation 'com.google.mlkit:translate:17.0.3'

    /*
     * ПОЧЕМУ ЭТИ ТРИ СТРОКИ ОБЯЗАТЕЛЬНЫ. Без них сборка падает на
     * checkReleaseDuplicateClasses: ML Kit приносит kotlin-stdlib-jdk7 и
     * -jdk8 версии 1.6.x, а androidx.core:1.13.1 — kotlin-stdlib 1.8.22.
     * Начиная с Kotlin 1.8 классы из jdk7/jdk8 переехали в ОСНОВНОЙ stdlib,
     * а старые артефакты их всё ещё содержат — получается по два
     * `kotlin.io.path.PathsKt` и ещё двадцать дубликатов.
     *
     * Gradle сам не выравнивает: он выбирает старшую версию каждого
     * артефакта по отдельности, и «старший stdlib + старый jdk8» — как раз
     * то сочетание, которое конфликтует.
     *
     * Проверяется скриптом tests/check_deps.py: он обходит POM-графы и
     * ловит именно это сочетание до сборки. Версия 1.8.22 — та, что тянет
     * androidx.core, поэтому выравниваем по ней.
     */
    constraints {
        implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
        implementation 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
        implementation 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
    }
}
