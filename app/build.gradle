plugins {
    id 'com.android.application'
}

android {
    namespace 'com.screentextscan'
    compileSdk 34

    defaultConfig {
        applicationId 'com.screentextscan'
        minSdk 26          // TileService (плитка быстрых настроек) появилась в API 24,
                           // но 26 даёт нормальные каналы уведомлений и foreground-сервис
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Подпись отладочным ключом: APK нужен для установки на своё
            // устройство, а не для публикации. Иначе release-сборка выйдет
            // неподписанной и не установится.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Только то, что реально нужно. androidx.core — для NotificationCompat
    // и ContextCompat; всё остальное делается платформенными API.
    implementation 'androidx.core:core:1.13.1'
}
